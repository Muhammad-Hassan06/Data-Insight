services:
  - type: web
    name: data-insight-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
